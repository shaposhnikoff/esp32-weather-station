[platformio]
default_envs = waveshare-lcd5b
src_dir = firmware/main

[env:waveshare-lcd5]
platform = espressif32@6.10.0
framework = espidf
board = esp32-s3-devkitc-1
platform_packages =
    framework-espidf@3.50400.0
    tool-cmake@file://tools/native-cmake
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.partitions = partitions.csv
board_build.esp-idf.sdkconfig_path = sdkconfig.weather
monitor_speed = 115200
build_flags =
    -I include

[env:waveshare-lcd5b]
extends = env:waveshare-lcd5
build_flags =
    ${env:waveshare-lcd5.build_flags}
    -DWEATHER_BOARD_LCD5B
